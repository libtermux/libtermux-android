name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# No job here is allowed to be skipped silently: a failing verification fails the workflow.
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # ── 1. Source-level checks (no Android SDK required) ────────────────────────────
  verify-sources:
    name: Source checks (naming, packages, JNI contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository consistency (packages, imports, manifests, rules, plugin ids, legacy-name gate)
        run: python3 scripts/verify_repo.py --list-upstream

      - name: JNI contract (Kotlin external funs <-> native Java_* symbols <-> CMake target)
        run: python3 scripts/verify_jni.py

  # ── 2. Lint + unit tests for every module that has tests ──────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    needs: verify-sources
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: chmod +x gradlew

      - name: Lint (:core)
        run: ./gradlew :core:lint --stacktrace

      - name: Unit tests (:core, :os, :shizuku)
        run: ./gradlew :core:testDebugUnitTest :os:testDebugUnitTest :shizuku:testDebugUnitTest --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            core/build/reports/tests/
            os/build/reports/tests/
            shizuku/build/reports/tests/

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: core/build/reports/lint-results*.html

  # ── 3. Build every library module + verify the native libraries ─────────────────
  build-modules:
    name: Build library modules & verify native libs
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: chmod +x gradlew

      - name: Assemble debug AARs (core builds all 4 ABIs via CMake)
        run: ./gradlew :core:assembleDebug :os:assembleDebug :terminal-view:assembleDebug :shizuku:assembleDebug --stacktrace

      - name: Verify exported JNI symbols in the built .so files (all ABIs)
        run: |
          set -euo pipefail
          rm -rf /tmp/core-aar && mkdir /tmp/core-aar
          unzip -q core/build/outputs/aar/core-debug.aar -d /tmp/core-aar
          for abi in arm64-v8a x86_64 armeabi-v7a x86; do
            so="/tmp/core-aar/jni/$abi/libaeonruntime_jni.so"
            [ -f "$so" ] || { echo "::error::missing $so in core AAR"; exit 1; }
          done
          python3 scripts/verify_jni.py --so /tmp/core-aar/jni/*/libaeonruntime_jni.so

      - name: Upload debug AARs
        uses: actions/upload-artifact@v4
        with:
          name: aeonruntime-debug-aars
          path: |
            core/build/outputs/aar/*.aar
            os/build/outputs/aar/*.aar
            terminal-view/build/outputs/aar/*.aar
            shizuku/build/outputs/aar/*.aar

  # ── 4. Bootstrap packaging check ──────────────────────────────────────────────────
  bootstrap-packaging:
    name: Bootstrap packaging (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: bootstrap-arm64,  arch: aarch64 }
          - { module: bootstrap-arm,    arch: arm }
          - { module: bootstrap-x86_64, arch: x86_64 }
          - { module: bootstrap-x86,    arch: i686 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: chmod +x gradlew

      - name: Assemble bootstrap module (downloads the bootstrap zip)
        run: ./gradlew :${{ matrix.module }}:assembleRelease --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify asset path matches what BootstrapInstaller reads
        run: |
          set -euo pipefail
          aar=$(ls ${{ matrix.module }}/build/outputs/aar/*-release.aar)
          unzip -l "$aar" | tee /tmp/aar.txt
          grep -q "assets/aeonruntime/bootstrap-${{ matrix.arch }}.zip" /tmp/aar.txt \
            || { echo "::error::bootstrap asset not found at assets/aeonruntime/bootstrap-${{ matrix.arch }}.zip"; exit 1; }

  # ── 5. Consumer integration: the sample app is an AeonRuntime consumer ────────────
  build-sample:
    name: Build Sample APK
    runs-on: ubuntu-latest
    needs: build-modules
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - run: chmod +x gradlew

      - name: Build sample APK
        run: ./gradlew :sample:assembleDebug --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: aeonruntime-sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
